[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "victoria-formatters"
version = "1.0.0"
description = "Formatadores de código para o Projeto Victoria"
readme = "README.md"
authors = [
    {name = "Equipe Victoria", email = "projetovictoria@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
requires-python = ">=3.10"
dependencies = [
    "black>=23.0",
    "isort>=5.12",
    "flake8>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.black]
line-length = 120
target-version = ['py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | node_modules
  | rate_limits
  | sessions
  | vendor
)/
'''
skip-string-normalization = false
skip-magic-trailing-comma = false
experimental-string-processing = false

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_gitignore = true
extend_skip = [
    "node_modules",
    "rate_limits",
    "sessions",
    "vendor",
    ".git",
]

[tool.flake8]
max-line-length = 120
extend-ignore = [
    "E203",  # whitespace before ':' (black compatibility)
    "W503",  # line break before binary operator (black compatibility)
]
exclude = [
    ".git",
    "__pycache__",
    "node_modules",
    "rate_limits",
    "sessions",
    "vendor",
    ".venv",
]
per-file-ignores = [
    "tools/python/*.py:E402",  # module level import not at top of file (legacy formatters)
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
exclude = [
    "node_modules",
    "rate_limits",
    "sessions",
    "vendor",
]